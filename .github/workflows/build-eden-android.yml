name: Build Eden Android (source)

on:
  workflow_dispatch:
  push:
    branches:
      - eden-android-build

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Install Eden source (shallow clone with retries)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf eden
            if git -c http.version=HTTP/1.1 clone --depth 1 --recurse-submodules --shallow-submodules https://git.eden-emu.dev/eden-emu/eden.git eden; then
              exit 0
            fi
            echo "Clone attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "Could not clone Eden source after 3 attempts."
          exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK environment
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -print

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platform-tools"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Check upstream Android build script
        working-directory: eden
        run: |
          test -f .ci/android/build.sh
          test -f src/android/gradlew
          chmod +x .ci/android/build.sh src/android/gradlew
          .ci/android/build.sh --help

      - name: Build standard Android variant
        working-directory: eden
        env:
          CCACHE: "false"
        run: .ci/android/build.sh -b RelWithDebInfo

      - name: Upload APK and AAB artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eden-android-build-output
          path: |
            eden/artifacts/*.apk
            eden/artifacts/*.aab
          if-no-files-found: warn
          retention-days: 7
