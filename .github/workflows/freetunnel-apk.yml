name: Build FreeTunnel APK

on:
  workflow_dispatch:
  push:
    paths:
      - "FreeTunnel/**"
      - ".github/workflows/freetunnel-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35,build-tools;35.0.0"

      - name: Download ARM64 tunnel engine
        run: |
          mkdir -p FreeTunnel/app/libs
          curl --fail --location --retry 3 \
            "https://github.com/Wendor/teapod-tun2socks/releases/download/v1.1.15/teapod-tun2socks-arm64-v8a-1.1.15.aar" \
            -o FreeTunnel/app/libs/teapod-tun2socks.aar
          test -s FreeTunnel/app/libs/teapod-tun2socks.aar

      - name: Build debug APK
        run: |
          cd FreeTunnel
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeTunnel-apk
          path: FreeTunnel/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
